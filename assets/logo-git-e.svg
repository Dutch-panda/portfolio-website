<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 68" width="88" height="88" fill="none">
  <defs>
    <!-- Single warm orange pinpoint glow centered directly on the apex circle (cx="50%" cy="50%" r="50%") -->
    <radialGradient id="apexGlow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFB067" stop-opacity="0.95" />
      <stop offset="38%" stop-color="#FF7B29" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#FF7B29" stop-opacity="0" />
    </radialGradient>
    <filter id="softGlow2" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.1" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Shifted 5px down inside viewBox so top glow (y=13, r=9.5 -> top=3.5) is never clipped -->
  <g transform="translate(0, 5)">
    <!-- Outer Geometric Wireframe Pyramid (Fine Monochrome Silver-White Hairlines) -->
    <polygon
      points="32,8 55,45 32,58 9,45"
      stroke="#E5E7EB"
      stroke-opacity="0.38"
      stroke-width="1"
      fill="rgba(255,255,255,0.01)"
    />
    <line x1="32" y1="8" x2="32" y2="58" stroke="#E5E7EB" stroke-opacity="0.18" stroke-width="0.85" />
    <line x1="9" y1="45" x2="55" y2="45" stroke="#E5E7EB" stroke-opacity="0.15" stroke-width="0.85" />

    <!-- Inner System Architecture / Directed Graph Topology (Nodes, Routing Edges & Diamond Decision Gate) -->
    <g filter="url(#softGlow2)">
      <!-- Lower Layer Routing Edges (Raw Distributed Inputs -> Mid-Tier Synthesis Nodes) -->
      <line x1="18" y1="44" x2="24" y2="32" stroke="#F4F4F6" stroke-width="1.35" />
      <line x1="32" y1="49" x2="24" y2="32" stroke="#F4F4F6" stroke-width="1.35" />
      <line x1="32" y1="49" x2="40" y2="32" stroke="#F4F4F6" stroke-width="1.35" />
      <line x1="46" y1="44" x2="40" y2="32" stroke="#F4F4F6" stroke-width="1.35" />
      <line
        x1="24"
        y1="32"
        x2="40"
        y2="32"
        stroke="#E5E7EB"
        stroke-opacity="0.55"
        stroke-width="1.1"
        stroke-dasharray="2 2"
      />

      <!-- Upper Layer Routing Edges (Mid-Tier Nodes -> Central Diamond Decision Gate -> Apex) -->
      <line x1="24" y1="32" x2="32" y2="22" stroke="#F4F4F6" stroke-width="1.45" />
      <line x1="40" y1="32" x2="32" y2="22" stroke="#F4F4F6" stroke-width="1.45" />
      <line x1="32" y1="19" x2="32" y2="10" stroke="#F4F4F6" stroke-width="1.55" />

      <!-- Central Architectural Decision Gate (Diamond Node at (32, 22)) -->
      <polygon
        points="32,18.2 35.8,22 32,25.8 28.2,22"
        fill="#0B0B0D"
        stroke="#F4F4F6"
        stroke-width="1.4"
      />

      <!-- Mid-Tier Processing / Synthesis Nodes -->
      <circle cx="24" cy="32" r="2.2" fill="#0B0B0D" stroke="#F4F4F6" stroke-width="1.4" />
      <circle cx="40" cy="32" r="2.2" fill="#0B0B0D" stroke="#F4F4F6" stroke-width="1.4" />

      <!-- Distributed Input System Nodes (Bottom Layer) -->
      <circle cx="18" cy="44" r="1.9" fill="#0B0B0D" stroke="#F4F4F6" stroke-width="1.3" />
      <circle cx="32" cy="49" r="2.1" fill="#0B0B0D" stroke="#F4F4F6" stroke-width="1.35" />
      <circle cx="46" cy="44" r="1.9" fill="#0B0B0D" stroke="#F4F4F6" stroke-width="1.3" />
    </g>

    <!-- Single Warm Orange Pinpoint Glow Centered Directly on the Top Apex (32, 8) -->
    <circle cx="32" cy="8" r="9.5" fill="url(#apexGlow2)" />
    <circle cx="32" cy="8" r="1.75" fill="#FFF7ED" />
  </g>
</svg>
