<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CV — Ehsan Negahdar | Business Data Analyst &amp; Problem-Solver</title>
    <meta
      name="description"
      content="Curriculum Vitae of Ehsan Negahdar — Business Data Analyst, Strategy, Process Optimization, Systems & Agentic AI."
    />
    <meta name="author" content="Ehsan Negahdar" />
    <meta name="theme-color" content="#0b0b0d" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="CV — Ehsan Negahdar | Business Data Analyst &amp; Systems" />
    <meta
      property="og:description"
      content="Curriculum Vitae of Ehsan Negahdar — Business Data Analyst, Strategy, Process Optimization, Systems &amp; Agentic AI."
    />
    <meta property="og:image" content="./assets/logo-git-e.svg" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="CV — Ehsan Negahdar | Business Data Analyst &amp; Systems" />
    <meta
      name="twitter:description"
      content="Curriculum Vitae of Ehsan Negahdar — Business Data Analyst, Strategy, Process Optimization, Systems &amp; Agentic AI."
    />
    <meta name="twitter:image" content="./assets/logo-git-e.svg" />

    <link rel="icon" type="image/svg+xml" href="./assets/logo-git-e.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles/main.css" />
  </head>
  <body data-page="cv">
    <!-- Full-Viewport Architectural Gray Vertical Stripes & Blueprint Grid -->
    <div class="ambient-grid" aria-hidden="true">
      <div class="crosshair-mark ch-top" aria-hidden="true"></div>
      <div class="crosshair-mark ch-left" aria-hidden="true"></div>
      <div class="crosshair-mark ch-right" aria-hidden="true"></div>
      <div class="crosshair-mark ch-bottom" aria-hidden="true"></div>
    </div>

    <!-- PERSISTENT MINIMAL TOP HEADER -->
    <header class="site-header">
      <div class="header-inner">
        <a
          href="./index.html"
          class="brand-logo-btn"
          aria-label="Home — Designer & Problem-Solver"
          title="Back to Home"
        >
          <img
            src="./assets/logo-git-e.svg"
            alt="Monochrome Git-Branch E Logo"
            class="brand-logo-svg"
          />
        </a>

        <nav class="header-nav" aria-label="Primary Navigation">
          <a href="./projects.html" class="nav-link">Projects</a>
          <a href="./cv.html" class="nav-link active">CV</a>
          <a href="./blog.html" class="nav-link">Blog</a>
          <a
            href="https://github.com/Dutch-panda"
            target="_blank"
            rel="noopener noreferrer"
            class="nav-link"
          >
            GitHub ↗
          </a>
          <a
            href="https://www.linkedin.com/in/ehsan-negahdar/"
            target="_blank"
            rel="noopener noreferrer"
            class="nav-link"
          >
            LinkedIn ↗
          </a>
          <a href="./index.html#stage-hero" class="availability-pill" title="Send a direct note">
            <span class="status-dot" aria-hidden="true"></span>
            <span>Available</span>
          </a>
        </nav>
      </div>
    </header>

    <!-- DEDICATED CV PAGE CONTAINER -->
    <main class="subpage-main">
      <div class="subpage-ActionBar no-print">
        <a href="./index.html" class="stage-step-btn">← Back to Overview</a>
        <div class="subpage-actions-right">
          <button type="button" class="stage-step-btn" data-copy-email>
            Copy Email (en.mirror@gmail.com)
          </button>
          <a
            href="./cv-a4.html"
            target="_blank"
            class="stage-step-btn"
            title="Open the light A4 printable sheet in a new tab"
          >
            Light A4 View ↗
          </a>
          <a
            href="./assets/Ehsan-Negahdar-CV.pdf"
            download="Ehsan-Negahdar-CV.pdf"
            class="drawer-action-btn"
          >
            Download Light CV (A4 PDF) ↓
          </a>
        </div>
      </div>

      <article class="stage-box cv-standalone-box" id="cv-page-content">
        <span class="box-corner-bl" aria-hidden="true"></span>
        <span class="box-corner-br" aria-hidden="true"></span>
        <!-- Populated dynamically from scripts/data.js -->
      </article>
    </main>

    <!-- PERSISTENT BOTTOM STATUS TICKER -->
    <footer class="site-footer no-print">
      <div class="footer-inner">
        <div class="footer-left">
          <span class="footer-label">Latest Updates — Oct 2026</span>
          <span class="footer-sep">|</span>
          <button
            type="button"
            id="footer-dispatch-btn"
            class="footer-dispatch-btn"
            title="Click to cycle recent dispatches"
          ></button>
        </div>

        <div class="footer-right">
          <span class="status-dot" aria-hidden="true"></span>
          <span>System status: <strong class="status-clean">Clean</strong></span>
          <button type="button" class="footer-contact-trigger" data-copy-email>
            Direct contact
          </button>
        </div>
      </div>
    </footer>

    <div id="toast-banner" class="toast-banner no-print" role="status" aria-live="polite"></div>

    <script src="./scripts/data.js"></script>
    <script src="./scripts/app.js"></script>
  </body>
</html>
